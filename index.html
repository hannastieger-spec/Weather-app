<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/style.css" />
    <title>Weather app</title>
  </head>
  <body>
    <div class="weather-app">
      <header>
        <form>
          <input type="search" placeholder="Enter a city..." />
          <input type="submit" value="Search" />
        </form>
      </header>
      <main>
        <div>
          <h1>Leipzig</h1>
          <p>
            Wednesday 11:55, clear sky <br />
            Humidity: 37%, Wind: 8.23km/h
          </p>
        </div>
        <div>☀️ 12°C</div>
      </main>
      <footer>
        Coded by
        <a href="https://github.com/hannastieger-spec" target="_blank"
          >Hanna Stieger</a
        >, open sourced on
        <a
          href="https://github.com/hannastieger-spec/Weather-app"
          target="_blank"
          >GitHub</a
        >
        and hosted on
        <a href="https://fantastic-dasik-adbea0.netlify.app/" target="_blank"
          >Netlify</a
        >
      </footer>
    </div>
    <script src="src/index.js"></script>
  </body>
</html>
